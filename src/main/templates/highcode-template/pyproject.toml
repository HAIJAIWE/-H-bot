[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "QQ Bat 高代码模式项目"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi]>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-alconna>=0.50.0",
    "loguru>=0.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    # 工具链：ruff 实时 lint / pyright 深度类型检查 / debugpy 源码级调试
    "ruff>=0.6.0",
    "pyright>=1.1.300",
    "debugpy>=1.8.0",
]

# ── 多平台适配器（可选依赖）────────────────────────────────────
# 默认只装 OneBot V11（QQ）。要跑其他平台时按需取消注释并：
#   pip install -e ".[feishu,kook]"   # 国内常用一键安装
#   pip install -e ".[all-adapters]"  # 全部适配器
# 启用后在 .env 里设 BOT_ADAPTERS=OneBot V11,Feishu,Kook 即可同时跑多平台。
# bot.py 会根据 .env 的 BOT_ADAPTERS 动态注册（详见 _ADAPTER_MAP）。
[project.optional-dependencies]
feishu = ["nonebot-adapter-feishu>=2.1.0"]        # 飞书（企业自建应用）
kook = ["nonebot-adapter-kook>=0.3.0"]            # KOOK（开黑啦，国内游戏社区）
qqguild = ["nonebot-adapter-qqguild>=0.1.0"]      # QQ 频道（已废弃，建议官方 API）
telegram = ["nonebot-adapter-telegram>=1.0.0"]     # Telegram（国外）
discord = ["nonebot-adapter-discord>=0.1.0"]       # Discord（国外）
mirai2 = ["nonebot-adapter-mirai2>=0.3.0"]        # mirai-api-http 协议端
satori = ["nonebot-adapter-satori>=0.10.0"]       # satori 统一协议（多平台）
# 国内常用：飞书 + KOOK 一键安装
cn = [
    "nonebot-adapter-feishu>=2.1.0",
    "nonebot-adapter-kook>=0.3.0",
]
# 全部：一键安装所有支持的适配器
all-adapters = [
    "nonebot-adapter-feishu>=2.1.0",
    "nonebot-adapter-kook>=0.3.0",
    "nonebot-adapter-qqguild>=0.1.0",
    "nonebot-adapter-telegram>=1.0.0",
    "nonebot-adapter-discord>=0.1.0",
    "nonebot-adapter-mirai2>=0.3.0",
    "nonebot-adapter-satori>=0.10.0",
]

[tool.nonebot]
plugins = ["src/plugins"]
plugin_dirs = ["src/plugins"]

[tool.ruff]
line-length = 100
target-version = "py310"
